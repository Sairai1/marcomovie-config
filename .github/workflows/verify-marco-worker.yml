name: Verify deployed MarcoSearch Worker
on:
  push:
    paths:
      - '.github/workflows/verify-marco-worker.yml'
  workflow_dispatch:
jobs:
  external-endpoint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Cloudflare endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          base='https://marcomovie-config.guochuwei0913.workers.dev'
          urls=[base+'/health',base+'/api.php/provide/vod/?'+urllib.parse.urlencode({'ac':'detail','wd':'Tetsuo'})]
          for idx, url in enumerate(urls):
              print('Checking',url,flush=True)
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'MarcoSearch-Healthcheck/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(request,timeout=45) as resp:
                      status=resp.status
                      raw=resp.read(150000).decode('utf-8','replace')
                  print('HTTP',status,'BODY',raw[:500],flush=True)
                  data=json.loads(raw)
                  assert status==200, f'HTTP {status}'
                  if idx==0:
                      assert data.get('ok') is True, 'Worker health did not return ok:true'
                      assert data.get('name')=='MarcoSearch Workers', 'Worker does not appear to run the MarcoSearch Cloudflare code'
                  else:
                      assert isinstance(data.get('list'),list), 'Search response missing list'
                      assert 'code' in data,'Search response missing CMS code'
              except Exception as exc:
                  print('CHECK FAILED:',type(exc).__name__,str(exc),flush=True)
                  raise
          PY
