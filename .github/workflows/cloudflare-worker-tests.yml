name: MarcoSearch Cloudflare Worker
on:
  push:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/cloudflare-worker-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/engine.js
          node --check src/index.js
          node --check tests/engine.test.js
      - name: Install Worker build tools
        run: npm install --no-audit --no-fund
      - name: Test federated CMS search logic
        run: npm test
      - name: Bundle-check Worker without deployment
        run: npx wrangler deploy --dry-run --outdir dist
